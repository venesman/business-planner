<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Business Planner</title>
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Business planner for MadisGenz Events and TUC Social Enterprise.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Business">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111;--ink2:#4d4d4d;--muted:#8c8c8c;--line:#e4e4e4;--head:#f1f0f6;--soft:#f6f6f6;--red:#b42318;--green:#16794a;--r:12px;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);--H:Archivo,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(var(--safeT) + 6px) 14px calc(var(--safeB) + 96px)}
.top{display:flex;align-items:center;gap:10px;padding:8px 0 12px;border-bottom:1.5px solid var(--ink);margin-bottom:14px}
.bizbtn{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.mono{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--H);font-weight:700;font-size:12px;letter-spacing:.04em;flex:none}
.bizbtn b{display:block;font-family:var(--H);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bizbtn small{color:var(--muted);font-size:12px}
.iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:#fff;flex:none}
.iconbtn svg{width:18px;height:18px}
h1.pg{font-family:var(--H);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:2px 0 4px}
.sub{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
.box{border:1.5px solid var(--ink);border-radius:var(--r);margin-bottom:14px;overflow:hidden;background:#fff}
.bh{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--head);border-bottom:1.5px solid var(--ink);padding:9px 12px;font-family:var(--H);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.bh small{font-family:Inter;font-weight:600;letter-spacing:0;text-transform:none;font-size:12px;color:var(--ink2)}
.bb{padding:12px}
.bb.np{padding:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:12.5px}
.in{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;outline:none}
.in:focus{border-color:var(--ink)}
textarea.in{resize:vertical;min-height:80px;line-height:1.45}
.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:12px 0 5px}
.fl:first-child{margin-top:0}
.cell{border-bottom:1px solid var(--line);padding:10px 12px}
.cell:last-child{border-bottom:0}
.cell .fl{margin:0 0 3px}
.cell input,.cell textarea{width:100%;border:0;outline:none;padding:2px 0;background:transparent}
.cell textarea{resize:vertical;min-height:44px;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr}
.grid2>.cell:nth-child(odd){border-right:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.trow:last-child{border-bottom:0}
.trow b{font-weight:600}
.trow .r{text-align:right;flex:none;font-weight:600;white-space:nowrap}
.trow .sm{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;border:1px solid var(--ink);white-space:nowrap;letter-spacing:.02em}
.pill.f{background:var(--ink);color:#fff}
.pill.g{border-color:var(--line);color:var(--ink2)}
.pill.red{border-color:var(--red);color:var(--red)}
.in-c{color:var(--green)}.out-c{color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:14px}
.btn.o{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.btn svg{width:16px;height:16px}
.plus{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.plus svg{width:17px;height:17px}
.link{font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.back{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-bottom:8px}
.back svg{width:16px;height:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr)}
.kpi{padding:10px 12px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:0}
.kpi small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:16px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.big{font-family:var(--H);font-weight:700;font-size:30px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{border:1.5px solid var(--ink);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:96px;background:#fff}
.tile svg{width:20px;height:20px}
.tile b{font-family:var(--H);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.tile span{font-size:12.5px;color:var(--muted);margin-top:-4px}
.sec{font-family:var(--H);font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin:6px 2px 10px}
.empty{text-align:center;color:var(--muted);padding:18px 12px;font-size:13.5px}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.chk{flex:none;width:20px;height:20px;border-radius:5px;border:1.6px solid var(--ink);display:grid;place-items:center;margin-top:1px;background:#fff}
.chk.on{background:var(--ink)}
.chk.on::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.task .txt{flex:1;min-width:0;text-align:left;word-break:break-word;line-height:1.4}
.task.done .txt{text-decoration:line-through;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:5px;background:var(--soft);color:var(--ink2);margin:3px 4px 0 0;font-weight:600}
.addrow{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.addrow input{flex:1;border:0;outline:none;padding:6px 0}
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.quad{border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;min-height:120px;display:flex;flex-direction:column}
.quad h4{margin:0;padding:7px 9px;font-family:var(--H);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;background:var(--head);border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}
.quad.do h4{background:var(--ink);color:#fff}
.quad .task{padding:7px 9px;font-size:13px}
.quad .chk{width:17px;height:17px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;padding:9px 2px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-right:1px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:7px 11px;border-radius:20px;border:1px solid var(--line);font-size:13px;font-weight:600;background:#fff}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px}
.cal .dow{font-size:10px;font-weight:700;letter-spacing:.08em;text-align:center;color:var(--muted);padding:3px 0}
.cal .d{aspect-ratio:1/1.1;border:1px solid var(--line);border-radius:7px;padding:3px 4px;display:flex;flex-direction:column;align-items:flex-start;font-size:12px;text-align:left;background:#fff}
.cal .d.today{border:1.5px solid var(--ink);font-weight:700}
.cal .d .dots{display:flex;gap:2px;margin-top:auto;flex-wrap:wrap}
.cal .d .dots i{width:5px;height:5px;border-radius:50%;background:var(--ink)}
.cal .d .dots i.o{background:#fff;border:1px solid var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);padding:0 12px 10px}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;background:var(--ink);vertical-align:middle}
.legend i.o{background:#fff;border:1px solid var(--ink)}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav2 .t{text-align:center}
.nav2 .t b{display:block;font-family:var(--H);font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.hour{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.hour:last-child{border-bottom:0}
.hour span{width:58px;padding:9px 12px;font-size:12px;color:var(--muted);border-right:1px solid var(--line);flex:none}
.hour input{flex:1;border:0;padding:9px 10px;outline:none}
.wday{border-bottom:1px solid var(--line)}
.wday:last-child{border-bottom:0}
.wday h5{margin:0;padding:8px 12px 2px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:flex;justify-content:space-between}
.wday.today h5{text-decoration:underline}
.bar{height:7px;border-radius:7px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--ink)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 10px;margin-bottom:12px}
.search svg{width:16px;height:16px;color:var(--muted)}
.search input{flex:1;border:0;outline:none;padding:10px 0}
.lines td,.lines th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
.lines{width:100%;border-collapse:collapse}
.lines th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);background:var(--soft)}
.lines input{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 7px;outline:none}
.tot{display:flex;justify-content:space-between;padding:6px 12px;font-size:14px}
.tot.big2{font-weight:700;font-size:17px;border-top:1.5px solid var(--ink);padding-top:10px;margin-top:4px}
.ytable{width:100%;border-collapse:collapse;font-size:12.5px}
.ytable th,.ytable td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ytable th:first-child,.ytable td:first-child{text-align:left}
.ytable th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--soft);color:var(--ink2)}
.ytable tr.sum td{font-weight:700;border-top:1.5px solid var(--ink)}
.ytable input{width:70px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.scrollx{overflow-x:auto}
nav.bn{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--ink);padding:6px 8px calc(var(--safeB) + 6px);z-index:20}
nav.bn .inn{max-width:560px;margin:0 auto;display:flex;gap:4px}
nav.bn button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav.bn button svg{width:20px;height:20px}
nav.bn button.on{color:#fff;background:var(--ink)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--safeB) + 80px);width:54px;height:54px;border-radius:16px;background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:15}
.fab svg{width:22px;height:22px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:10px 18px calc(var(--safeB) + 18px);animation:up .2s ease-out;border-top:1.5px solid var(--ink)}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-family:var(--H);font-weight:700;font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin:4px 0 12px}
.sheet .acts{display:flex;gap:8px;margin-top:18px;position:sticky;bottom:0;background:#fff;padding-top:8px}
.sheet .acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 150px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:60;animation:fade .2s;max-width:90vw;text-align:center}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.lnks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.lnks a{color:var(--ink);font-weight:600;font-size:13px;border:1px solid var(--ink);border-radius:20px;padding:6px 12px;text-decoration:none}
/* invoice */
.inv{border:1.5px solid var(--ink);border-radius:var(--r);padding:20px 18px;background:#fff}
.inv h2{font-family:var(--H);font-size:24px;letter-spacing:.06em;margin:0}
.inv .meta{display:flex;justify-content:space-between;gap:12px;margin:14px 0;font-size:13px;line-height:1.5}
@media print{
  nav.bn,.top,.fab,.noprint,.back{display:none!important}
  .app{padding:0;max-width:none}
  .inv{border:0;padding:0}
  body{font-size:12pt}
}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="bn noprint"><div class="inn" id="nav"></div></nav>
<div id="overlay"></div>

/* ===== money calcs ===== */
const ORDER_ST=['Quote','Confirmed','In progress','Shipped','Completed','Cancelled','Returned'];
const PAY_ST=['Unpaid','Deposit','Paid','Refunded'];
function orderCalc(o){
  const sub=sum(o.items||[],i=>num(i.price)*num(i.qty||1));
  let disc=num(o.discount);
  if(o.code){const d=D.discounts.find(x=>x.code&&x.code.toUpperCase()===o.code.toUpperCase());if(d)disc=d.kind==='%'?sub*num(d.amount)/100:num(d.amount)}
  const ship=num(o.shipping), taxp=num(o.tax), tax=(sub-disc)*taxp/100;
  const total=Math.max(0,sub-disc+ship+tax);
  const paid=o.pay==='Paid'?total:o.pay==='Deposit'?Math.min(total,num(o.paid)):0;
  return {sub,disc,ship,tax,total,paid,due:Math.max(0,total-paid)};
}
const counts=o=>!['Quote','Cancelled'].includes(o.status);
const ordersIn=ym=>D.orders.filter(o=>(o.date||'').startsWith(ym));
const revenueIn=ym=>sum(D.orders.filter(o=>counts(o)&&(o.date||'').startsWith(ym)),o=>orderCalc(o).paid)+sum(D.income.filter(x=>(x.date||'').startsWith(ym)),x=>x.amount);
const expensesIn=ym=>sum(D.expenses.filter(x=>(x.date||'').startsWith(ym)),x=>x.amount)+sum(D.ads.filter(x=>(x.start||'').startsWith(ym)),x=>x.cost);
function productSales(prefix){const m={};D.orders.filter(o=>counts(o)&&(!prefix||(o.date||'').startsWith(prefix))).forEach(o=>(o.items||[]).forEach(i=>{const k=i.pid?(find(D.products,i.pid)?.name||i.desc):i.desc;if(!k)return;m[k]=m[k]||{qty:0,rev:0};m[k].qty+=num(i.qty||1);m[k].rev+=num(i.price)*num(i.qty||1)}));return Object.entries(m).sort((a,b)=>b[1].qty-a[1].qty)}
function soldSince(p){return sum(D.orders.filter(o=>counts(o)&&o.status!=='Returned'&&(!p.countDate||(o.date||'')>=p.countDate)),o=>sum((o.items||[]).filter(i=>i.pid===p.id),i=>i.qty||1))}
const stockLeft=p=>num(p.onHand)-soldSince(p);
const unitProfit=p=>num(p.price)-num(p.cost)-num(p.fee)-num(p.ship);

const defDate=()=>U.mm===ymOf(today())?today():U.mm+'-01';
function contactLinks(x){
  const l=[];const ph=(x.phone||'').replace(/[^\d+]/g,'');

  if(x.email)l.push(`<a href="mailto:${esc(x.email)}">Email</a>`);
  if(x.website){const u=/^https?:/.test(x.website)?x.website:'https://'+x.website;l.push(`<a href="${esc(u)}" target="_blank" rel="noopener">Website</a>`)}
  return l.length?`<div class="lnks">${l.join('')}</div>`:'';
}

function vShipping(){
  const list=D.orders.filter(o=>o.needsShip&&counts(o)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

/* ===== PRODUCTS ===== */
function vProducts(){
  const low=D.products.filter(p=>p.kind!=='service'&&num(p.low)>0&&stockLeft(p)<=num(p.low));
  const val=sum(D.products.filter(p=>p.kind!=='service'),p=>Math.max(0,stockLeft(p))*num(p.cost));
  return head('Products & suppliers','Products','newProduct')+
   box('Overview',kpis([['Items',D.products.length],['Low stock',low.length,low.length?'out-c':''],['Stock value',money(val)]]),'',true)+
   tiles([['inventory','box','Inventory',`${D.products.filter(p=>p.kind!=='service').length} products · ${D.products.filter(p=>p.kind==='service').length} services`],['suppliers','factory','Suppliers',`${D.suppliers.length} saved`],['launches','rocket','Product planner',`${D.launches.length} launches`],['evaluation','star','Evaluation','Top & bottom sellers'],['profit','pie','Profit tracker','Per product & per month']]);
}
function vInventory(){
  const list=D.products.filter(p=>matchQ(p,'inv',['name','sku'])).sort((a,b)=>(a.kind==='service')-(b.kind==='service')||(a.name||'').localeCompare(b.name||''));
  return backBtn('products','Products')+head('Product inventory','Inventory','newProduct')+(D.products.length>4?searchBox('inv'):'')+
   box('Products & services',list.map(p=>{const left=stockLeft(p),lowS=p.kind!=='service'&&num(p.low)>0&&left<=num(p.low);return `<button class="trow" data-a="editProduct" data-id="${p.id}"><span class="grow"><b>${esc(p.name)}</b><div class="sm">${p.kind==='service'?'Service':`On hand ${left}${num(p.onOrder)?' · on order '+num(p.onOrder):''}`} · price ${money(num(p.price))}</div></span><span class="r">${p.kind==='service'?'':`<span class="pill ${lowS?'red':left<=0?'red':'g'}">${left<=0?'Out':lowS?'Low':left+' left'}</span><br>`}<span class="small">${money(unitProfit(p))} profit</span></span></button>`}).join('')||empty('Add what you sell — products (with stock) or services and packages.'),`<small>${list.length}</small>`,true)+
   `<p class="small muted">Stock goes down automatically when you add the product to a confirmed order. Update “on hand” whenever you restock or recount.</p>`;
}
function productForm(p){
  const isNew=!p;p=p||{kind:'product'};
  sheet(isNew?'New product / service':'Edit product',[
    {name:'name',label:'Name',value:p.name||''},
    {name:'kind',label:'Type',type:'chips',options:[['product','Product (has stock)'],['service','Service / package']],value:p.kind||'product'},
    {name:'sku',label:'Code / SKU',value:p.sku||''},
    {name:'price',label:'Sales price',type:'number',value:p.price??''},
    {name:'cost',label:'Cost per unit',type:'number',value:p.cost??''},
    {name:'fee',label:'Platform / payment fee per unit',type:'number',value:p.fee??''},
    {name:'ship',label:'Shipping / delivery cost per unit',type:'number',value:p.ship??''},
    {name:'onHand',label:'Quantity on hand (counted today)',type:'number',value:isNew?'':Math.max(0,stockLeft(p))},
    {name:'onOrder',label:'Quantity on order from supplier',type:'number',value:p.onOrder??''},
    {name:'low',label:'Warn me when stock is at or below',type:'number',value:p.low??''},
    {name:'supplier',label:'Supplier',type:'select',options:[['','—'],...D.suppliers.map(s=>[s.id,s.name])],value:p.supplier||''},
    {name:'notes',label:'Notes',type:'textarea',value:p.notes||''}
  ],v=>{if(!v.name)return toast('Name is needed');['price','cost','fee','ship','onOrder','low'].forEach(k=>v[k]=v[k]===''?'':num(v[k]));
    const newHand=v.onHand===''?'':num(v.onHand);delete v.onHand;
    if(isNew){D.products.push({id:uid(),...v,onHand:newHand===''?0:newHand,countDate:today()})}
    else{Object.assign(p,v);if(newHand!==''&&newHand!==Math.max(0,stockLeft(p))){p.onHand=newHand;p.countDate=today()}}
    save()},isNew?null:()=>{D.products=D.products.filter(x=>x!==p);save()},
  isNew?'':`<div class="box" style="margin-top:14px">${kpis([['Profit / unit',money(unitProfit(p))],['Margin',num(p.price)?Math.round(unitProfit(p)/num(p.price)*100)+'%':'—'],['Sold',soldSince(p)+(p.countDate?' since '+fmtD(p.countDate):'')]])}</div>`);
}

function vProfit(){
  const y=U.yr;let rows='',T={rev:0,sup:0,ship:0,over:0,ads:0};
  MON.forEach((m,i)=>{const ym=`${y}-${pad(i+1)}`,rev=revenueIn(ym),ex=D.expenses.filter(x=>(x.date||'').startsWith(ym));
    const sup=sum(ex.filter(x=>x.cat==='Supplies & materials'),x=>x.amount),ship=sum(ex.filter(x=>x.cat==='Transport'),x=>x.amount)+sum(D.orders.filter(o=>counts(o)&&(o.shipped||o.date||'').startsWith(ym)),o=>o.shipCost);
    const ads=sum(D.ads.filter(a=>(a.start||'').startsWith(ym)),a=>a.cost),over=sum(ex.filter(x=>!['Supplies & materials','Transport'].includes(x.cat)),x=>x.amount)+ads;
    T.rev+=rev;T.sup+=sup;T.ship+=ship;T.over+=over;
    rows+=`<tr><td>${m.slice(0,3)}</td><td>${rev?rev.toFixed(0):'·'}</td><td>${sup?sup.toFixed(0):'·'}</td><td>${ship?ship.toFixed(0):'·'}</td><td>${over?over.toFixed(0):'·'}</td><td><b>${(rev-sup-ship-over).toFixed(0)}</b></td></tr>`});

/* ===== sheet ===== */
let SHEET=null,confirmFn=null;
function sheet(title,fields,onSave,onDelete,extra=''){
  SHEET={fields,onSave,onDelete};
  const f=fields.map(x=>{const v=x.value??'';let inp;
    if(x.type==='textarea')inp=`<textarea class="in" name="${x.name}" placeholder="${esc(x.ph||'')}">${esc(v)}</textarea>`;
    else if(x.type==='select')inp=`<select class="in" name="${x.name}">${(x.options||[]).map(o=>{const [val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
    else if(x.type==='chips')inp=`<div class="chips">${x.options.map(([val,lab])=>`<button type="button" class="${String(val)===String(v)?'on':''}" data-a="chip" data-val="${esc(val)}">${esc(lab)}</button>`).join('')}</div><input type="hidden" name="${x.name}" value="${esc(v)}">`;
    else if(x.type==='multi'){const on=String(v).split('|');inp=`<div class="chips" data-multi="1">${x.options.map(o=>`<button type="button" class="${on.includes(o)?'on':''}" data-a="chip" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div><input type="hidden" name="${x.name}" value="${esc(v)}">`}
    else inp=`<input class="in" name="${x.name}" type="${x.type==='number'?'text':x.type||'text'}" ${x.type==='number'?'inputmode="decimal"':''} value="${esc(v)}" placeholder="${esc(x.ph||'')}">`;
    return `<label class="fl">${x.label}</label>${inp}`}).join('');
  document.getElementById('overlay').innerHTML=`<div class="scrim" data-a="closeSheet"><form class="sheet" onsubmit="return false"><div class="grab"></div><h2>${title}</h2>${f}${extra}<div class="acts">${onDelete?`<button type="button" class="btn danger" data-a="sheetDel">${ic('trash')}</button>`:''}<button type="button" class="btn o" data-a="closeSheet">Cancel</button><button type="submit" class="btn" data-a="sheetSave">Save</button></div></form></div>`;
}
function closeSheet(){document.getElementById('overlay').innerHTML='';SHEET=null;confirmFn=null}
function sheetVals(){const o={};document.querySelectorAll('.sheet [name]').forEach(e=>o[e.name]=e.value.trim());return o}
function confirmBox(msg,fn,label='Delete'){confirmFn=fn;document.getElementById('overlay').innerHTML=`<div class="scrim" data-a="closeSheet"><div class="sheet"><div class="grab"></div><h2>Are you sure?</h2><p>${msg}</p><div class="acts"><button class="btn o" data-a="closeSheet">Cancel</button><button class="btn danger" data-a="confirmYes">${label}</button></div></div></div>`}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);return false}
function pickSheet(title,opts){document.getElementById('overlay').innerHTML=`<div class="scrim" data-a="closeSheet"><div class="sheet"><div class="grab"></div><h2>${title}</h2>${opts}<div class="acts"><button class="btn o" data-a="closeSheet">Close</button></div></div></div>`}

  chip:(e,d,el)=>{const wrap=el.parentElement,h=wrap.nextElementSibling;if(wrap.dataset.multi){el.classList.toggle('on');h.value=[...wrap.querySelectorAll('button.on')].map(b=>b.dataset.val).join('|');return}wrap.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));h.value=d.val},
  closeSheet:(e,d,el)=>{if(e.target===el||el.tagName==='BUTTON')closeSheet()},
  sheetSave:()=>{if(!SHEET)return;if(SHEET.onSave(sheetVals())===false)return;closeSheet();render()},
  sheetDel:()=>{if(!SHEET)return;const fn=SHEET.onDelete;confirmBox('This will be deleted.',()=>fn())},
  confirmYes:()=>{const fn=confirmFn;closeSheet();fn&&fn();render()},
  backup:()=>{flush();const all={app:'bizplanner',v:1,G,biz:{}};G.biz.forEach(b=>all.biz[b.id]=b.id===G.active?D:loadBiz(b.id));const blob=new Blob([JSON.stringify(all)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='business-planner-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);try{localStorage.setItem('bizplanner-backup',today())}catch(e){}toast('Backup downloaded');render()},
  pickRestore:()=>document.getElementById('restoreFile').click(),
};
const ENTER={
  addTask:inp=>{const v=inp.value.trim();if(!v)return;D.tasks.push({id:uid(),text:v,date:inp.dataset.date||'',done:false});save();const sel=inp.dataset.date;render();const n=document.querySelector(`[data-enter="addTask"][data-date="${sel}"]`);n&&n.focus()},
  addStep:inp=>{const v=inp.value.trim();if(!v)return;const g=find(D.goals,inp.dataset.g);g.steps=g.steps||[];g.steps.push({id:uid(),text:v,done:false});save();render();const n=document.querySelector('[data-enter="addStep"]');n&&n.focus()},
  modQuick:inp=>{const v=inp.value.trim();if(!v)return;const m=MOD[inp.dataset.k];D[m.key].push({id:uid(),created:Date.now(),[m.quick]:v});save();render();const n=document.querySelector('[data-enter="modQuick"]');n&&n.focus()},
};
function setBind(path,val){
  const parts=path.split('|');let o=D;
  for(let i=0;i<parts.length-1;i++){const k=parts[i];
    if(k.startsWith('#')){o=o.find(x=>x.id===k.slice(1));if(!o)return;continue}
    if(o[k]===undefined||o[k]===null||typeof o[k]!=='object')o[k]=/^\d+$/.test(parts[i+1])&&parts[i+1].length===1?[]:{};o=o[k]}
  o[parts[parts.length-1]]=val;save();
}
function restoreFrom(text){try{const o=JSON.parse(text);if(o.app!=='bizplanner'||!o.G)throw 0;G=o.G;Object.entries(o.biz||{}).forEach(([id,d])=>{try{localStorage.setItem(LSB+id,JSON.stringify(d))}catch(e){}});D=loadBiz(curBiz().id);save();render();toast('Backup restored')}catch(e){toast('That isn’t a business planner backup')}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const fn=A[el.dataset.a];if(!fn)return;if(el.dataset.a==='closeSheet'&&e.target!==el&&el.classList.contains('scrim'))return;e.preventDefault();fn(e,el.dataset,el)});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.b){setBind(el.dataset.b,el.dataset.n?(el.value===''?'':num(el.value)):el.value)}
  if(el.dataset.g){G.settings[el.dataset.g]=el.value;save()}
  if(el.dataset.a2==='search'){U.q[el.dataset.k]=el.value;const pos=el.selectionStart;render();const n=document.getElementById('q-'+el.dataset.k);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset;
  if(d.b&&d.rr)render();
  if(d.g)render();
  if(d.a2==='itemPid'){const o=find(D.orders,d.o),it=find(o.items,d.i);it.pid=el.value;if(el.value){const p=find(D.products,el.value);it.desc=p.name;it.price=p.price}save();render()}
  if(d.a2==='custName'){const o=find(D.orders,d.o),n=el.value.trim();o.customer=n;let c=D.customers.find(x=>x.name.toLowerCase()===n.toLowerCase());
    if(c){o.cid=c.id;['phone','email','address'].forEach(k=>{if(!o[k]&&c[k])o[k]=c[k]})}else if(n){c={id:uid(),name:n,phone:o.phone||'',email:o.email||'',address:o.address||'',created:Date.now()};D.customers.push(c);o.cid=c.id;toast('Saved '+n+' as a new customer')}
    save();render()}
  if(d.a2==='needsShip'||d.a2==='flag'){const o=find(D.orders,d.o);o[d.a2==='flag'?d.k:'needsShip']=el.checked;save();render()}
  if(d.a2==='ocode'){const o=find(D.orders,d.o);o.code=el.value;save();render()}
  if(el.id==='restoreFile'&&el.files&&el.files[0]){const r=new FileReader();r.onload=()=>confirmBox('Replace everything on this phone with this backup?',()=>restoreFrom(r.result),'Restore');r.readAsText(el.files[0]);el.value=''}
});
document.addEventListener('focusout',e=>{const el=e.target;if(el.closest&&el.closest('[data-b^="orders|"]')){const o=find(D.orders,U.order);if(o&&o.cid){const c=find(D.customers,o.cid);if(c)['phone','email','address'].forEach(k=>{if(o[k]&&!c[k])c[k]=o[k]});save()}}});
document.addEventListener('keydown',e=>{const el=e.target;
  if(e.key==='Enter'&&el.dataset&&el.dataset.enter&&!e.isComposing){e.preventDefault();ENTER[el.dataset.enter](el)}
  if(e.key==='Enter'&&el.closest&&el.closest('.sheet')&&el.tagName==='INPUT'){e.preventDefault();A.sheetSave()}
  if(e.key==='Escape')closeSheet();
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
window.addEventListener('pagehide',flush);
render();
</script>
